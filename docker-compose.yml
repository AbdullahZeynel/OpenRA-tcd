# Tactics & Command Dynamics dedicated server.
#
#     cp .env.example .env     # edit it, then
#     docker compose up -d --build
#
# Everything an operator changes lives in .env next to this file. Compose reads
# it automatically and substitutes the values below; without one, every default
# here applies and the server still starts.
#
# A value in .env is substituted into this file — it is not handed to the
# container by itself. That is why each setting appears twice: once as ${...}
# and once as the environment variable launch-dedicated.sh actually reads.
#
# On Coolify, deploy this as a Docker Compose resource and map the port as a raw
# TCP port. There is no HTTP endpoint to route: the server speaks OpenRA's own
# protocol, so a domain and a reverse proxy have nothing to do here. Coolify's
# own environment-variable panel feeds the same ${...} names, so a deployment
# there needs no .env file at all.

services:
  server:
    build:
      context: .
      args:
        # The release tag your players run. A mismatch here and their AppImage
        # cannot join: OpenRA refuses a client on a different version.
        VERSION: "${TCD_VERSION:-release-tcd-0.2.0}"
    image: openra-tcd-server
    restart: unless-stopped

    # launch-dedicated.sh loops rather than forwarding signals, so a stop is a
    # kill. Nothing is lost: game state lives in the clients.
    stop_grace_period: 10s

    # Published and listened-on ports come from one variable on purpose. They
    # have to agree — the server advertises the port it was told to listen on,
    # and a client dialling the other one reaches nothing.
    ports:
      - "${TCD_PORT:-1234}:${TCD_PORT:-1234}/tcp"

    volumes:
      - content:/data

    environment:
      # Every variable here is one launch-dedicated.sh reads.

      # What the server browser shows. This is the one worth setting.
      Name: "${TCD_SERVER_NAME:-TCD Dedicated}"

      ListenPort: "${TCD_PORT:-1234}"

      # Empty means the server picks one. Set a map UID to pin it.
      Map: "${TCD_MAP:-}"

      # Empty means anyone can join.
      Password: "${TCD_PASSWORD:-}"

      # With this on, the server registers with master.openra.net and appears in
      # everyone's server browser, so nobody needs to type an address.
      AdvertiseOnline: "${TCD_ADVERTISE_ONLINE:-True}"

      # Restricts the lobby to players with an OpenRA forum account.
      RequireAuthentication: "${TCD_REQUIRE_AUTHENTICATION:-False}"

      # Lets one player start a game alone. Off keeps a public lobby waiting for
      # a second player rather than being consumed by whoever arrives first.
      EnableSingleplayer: "${TCD_ENABLE_SINGLEPLAYER:-False}"

      # Replays land in the volume and are never cleaned up.
      RecordReplays: "${TCD_RECORD_REPLAYS:-False}"

      # Below here are settings a deployment has no reason to differ on.
      Mod: "ra"
      AdvertiseOnLocalNetwork: "False"
      EnableSyncReports: "False"
      EnableGeoIP: "True"
      EnableLintChecks: "True"
      ShareAnonymizedIPs: "True"

      # Game content, replays and downloaded maps. The entrypoint fills this on
      # first start.
      SupportDir: "/data/"

volumes:
  content:
