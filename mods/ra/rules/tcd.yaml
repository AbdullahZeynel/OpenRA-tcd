# Tactics & Command Dynamics
#
# Every rule this mod adds lives here. Loaded after ra|rules/world.yaml so it can
# override traits defined there. Keeping our changes in one file is what holds our
# upstream footprint to four files (see AGENTS.md section 7).

^BaseWorld:
	-Selection:
	TcdSelection:
	SquadManager:
	FormationCapture:

# SquadRecruiter watches production, which the map editor never does. It declares
# SystemActors.World, so it goes on World alone rather than on ^BaseWorld, which
# EditorWorld also inherits.
World:
	SquadRecruiter:

# Formation roles. Rank 0 is the front of the formation; higher ranks stand behind.
# Anything without this trait is treated as Line, rank 1.

# What each role shoots at first.
#
# RA gives every valid target the same priority (rules/defaults.yaml:180 sets
# ValidTargets and no Priority at all), so AutoTarget falls back to whatever is
# nearest and a rocket soldier empties itself into infantry. The engine already
# has the mechanism to fix that: AutoTargetPriority is a conditional trait, an
# actor may carry several, and ChooseTarget takes the highest priority match and
# only uses range to break a tie (AutoTarget.cs:458).
#
# Priority 3 is what the unit exists to kill; 2 is acceptable; RA's own entries
# stay at 1 and catch everything else. Nothing here is removed, only added to.
#
# This does not send units wandering. The scan radius is the weapon's own range
# (AutoTarget.cs:312), and a unit on the default Defend stance is not allowed to
# move to a target at all (AutoTarget.cs:146 and :55), so out-of-range targets
# are filtered out before priority is ever consulted. A rocket soldier with a
# tank in missile range and infantry at its feet shoots the tank; with the tank
# out of range it shoots the infantry.
#
# The numbers are the tuning surface. Change them here.

1TNK:
	FormationRole:
		Role: Armor
		Rank: 0
	AutoTargetPriority@TCD1:
		ValidTargets: Vehicle
		InvalidTargets: NoAutoTarget
		Priority: 3
	AutoTargetPriority@TCD2:
		ValidTargets: Infantry
		InvalidTargets: NoAutoTarget
		Priority: 2

2TNK:
	FormationRole:
		Role: Armor
		Rank: 0
	AutoTargetPriority@TCD1:
		ValidTargets: Vehicle, Defense
		InvalidTargets: NoAutoTarget
		Priority: 3

